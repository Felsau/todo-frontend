*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#EDEBE6;font-family:"BJ",sans-serif;color:#111;position:relative;overflow:hidden}
/* Everything sits straight on one grid; only the today sticker tilts, like the stickers in the app header (owner: the old one looked crooked). */
.left{position:absolute;left:84px;top:0;width:500px;height:630px;display:flex;flex-direction:column;justify-content:center;gap:28px}

.stk .k{display:block;font-size:22px;line-height:1.3}.stk b{display:block;font-size:58px;line-height:1.1}.stk .d{display:block;font-size:22px;line-height:1.3}
.list{position:absolute;left:640px;top:0;width:476px;height:630px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.card{height:112px;border:4px solid #111;border-radius:18px;box-shadow:8px 8px 0 #111;display:flex;align-items:center;gap:20px;padding:0 22px}
.cb{width:46px;height:46px;border:4px solid #111;border-radius:11px;background:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.body{display:flex;flex-direction:column;gap:9px;min-width:0}
.t{font-weight:700;font-size:29px;line-height:1.3;white-space:nowrap}
.chips{display:flex;gap:10px}
.pill{font-weight:600;font-size:19px;line-height:1.3;border:3px solid #111;border-radius:999px;padding:1px 14px;background:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.hi{background:#FFC9D9}.no{background:#FFE066}
.done{background:#fff}.done .t{text-decoration:line-through;text-decoration-thickness:3px}
