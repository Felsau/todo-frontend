*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#EDEBE6;font-family:"BJ",sans-serif;color:#111;position:relative;overflow:hidden}
/* Straight grid, only the today sticker tilts. Sized for chat thumbnails (~400 px wide): big type, one chip per card, little empty space (owner check in Discord). */
.left{position:absolute;left:56px;top:0;width:520px;height:630px;display:flex;flex-direction:column;justify-content:center;gap:30px}
.title{align-self:flex-start;background:#FFD43B;border:6px solid #111;border-radius:26px;box-shadow:12px 12px 0 #111;font-weight:700;font-size:124px;line-height:1.22;padding:2px 36px 10px}
.tag{font-weight:700;font-size:38px;line-height:1.4}
.stk{align-self:flex-start;margin-left:8px;width:210px;transform:rotate(-4deg);background:#FFD43B;border:5px solid #111;border-radius:20px;box-shadow:9px 9px 0 #111;text-align:center;padding:10px 0 12px;font-weight:700}
.stk .k{display:block;font-size:28px;line-height:1.3}.stk b{display:block;font-size:76px;line-height:1.05}.stk .d{display:block;font-size:28px;line-height:1.3}
.list{position:absolute;left:612px;top:0;width:538px;height:630px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.card{height:156px;border:5px solid #111;border-radius:22px;box-shadow:10px 10px 0 #111;display:flex;align-items:center;gap:22px;padding:0 26px}
.cb{width:60px;height:60px;border:5px solid #111;border-radius:14px;background:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.body{display:flex;flex-direction:column;gap:12px;min-width:0}
.t{font-weight:700;font-size:35px;line-height:1.3;white-space:nowrap}
.pill{align-self:flex-start;font-weight:700;font-size:26px;line-height:1.3;border:4px solid #111;border-radius:999px;padding:2px 18px;background:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.hi{background:#FFC9D9}.no{background:#FFE066}
.done{background:#fff}.done .t{text-decoration:line-through;text-decoration-thickness:4px}

<div class="left">
