<!doctype html><html><head><meta charset="utf-8"><title>icon</title><style>
*{margin:0}html,body{width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:transparent}
body.bg{background:#EDEBE6}svg{display:block}
</style></head><body>
<script>
const q=new URLSearchParams(location.search);
const size=+q.get('size')||512, maskable=q.get('maskable')==='1', opaque=q.get('opaque')==='1';
const small=size<=48, scale=maskable?0.5:opaque?0.76:1;
if(maskable||opaque)document.body.className='bg';
const vb=small?'1.5 1.5 29 29':'1.5 1.5 30.5 30.5';
const sh=small?'':'<rect x="4.5" y="4.5" width="26" height="26" rx="7" fill="#111"/>';
const s=size*scale;
document.body.innerHTML='<svg width="'+s+'" height="'+s+'" viewBox="'+vb+'">'+sh+'<rect x="3" y="3" width="26" height="26" rx="7" fill="#FFD43B" stroke="#111" stroke-width="'+(small?2.5:1.5)+'"/><path d="M9 16.5l4.5 4.5L23 11" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
</script></body></html>
